[project]
name = "omnifind-local"
version = "0.1.0"
description = "Windows selected-folder local file retrieval core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers>=5,<6",
  "torch>=2.2,<3",
  "numpy>=2,<3",
  "huggingface-hub>=1,<3",
  "pypdf>=6,<7",
  "Pillow>=11,<13",
  "reportlab>=4,<5",
  "psutil>=7,<8",
  "PySide6>=6.8,<7",
  "winrt-Windows.Media.Ocr>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3,<4; sys_platform == 'win32'",
  "winrt-Windows.Globalization>=3,<4; sys_platform == 'win32'",
]

[tool.uv]
package = false
