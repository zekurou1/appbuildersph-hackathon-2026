[project]
name = "omnifind-local"
version = "0.1.0"
description = "Windows selected-folder local file retrieval core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "transformers>=5,<6",
  "torch>=2.2,<3",
  "numpy>=2,<3",
  "huggingface-hub>=1,<3",
  "pypdf>=6,<7",
  "Pillow>=11,<13",
  "reportlab>=4,<5",
  "psutil>=7,<8",
]

[tool.uv]
package = false
